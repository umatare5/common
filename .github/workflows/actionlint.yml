name: actionlint

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "The branch, tag or SHA to checkout"
        required: false
        type: string
        default: ""
      runs_on:
        description: "Runner to use for the job"
        required: false
        type: string
        default: "ubuntu-24.04"
      fetch_depth:
        description: "Number of commits to fetch (0 = all history)"
        required: false
        type: number
        default: 1
      actionlint_version:
        description: "actionlint release to run"
        required: false
        type: string
        default: "v1.7.12"
      workflow_pattern:
        description: "Pattern for workflow files to check"
        required: false
        type: string
        default: ""
      config_file:
        description: "Path to actionlint config file"
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  actionlint:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      # Checkout the code repository to access GitHub Actions workflow files
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: ${{ inputs.fetch_depth }}
          persist-credentials: false

      # The installer is fetched at the pinned tag rather than at main, so the
      # script that runs here is the one this version was reviewed against
      - name: Download actionlint
        id: get_actionlint
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint_version }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            | bash -s -- "${ACTIONLINT_VERSION#v}"

      # A finding has to fail the step, because a linter whose exit code is
      # discarded reports success on every run and the check becomes decorative
      - name: Check workflow files
        env:
          EXECUTABLE: ${{ steps.get_actionlint.outputs.executable }}
          CONFIG_FILE: ${{ inputs.config_file }}
          WORKFLOW_PATTERN: ${{ inputs.workflow_pattern }}
        run: |
          args=()
          if [ -n "$CONFIG_FILE" ] && [ -f "$CONFIG_FILE" ]; then
            args+=(-config-file "$CONFIG_FILE")
          fi
          if [ -n "$WORKFLOW_PATTERN" ]; then
            args+=("$WORKFLOW_PATTERN")
          fi

          "$EXECUTABLE" "${args[@]}"
