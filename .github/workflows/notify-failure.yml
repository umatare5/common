name: Reusable Failure Notification Workflow

# Required permissions for calling workflow:
# permissions:
#   issues: write        # For opening and commenting on the tracking issue

on:
  workflow_call:
    inputs:
      workflow_name:
        description: "Name of the workflow that failed"
        required: true
        type: string
      run_url:
        description: "URL of the failed run"
        required: true
        type: string
      runs_on:
        description: "Runner to use for the job"
        required: false
        type: string
        default: "ubuntu-24.04"
      timeout_minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  notify:
    name: Notify Failure
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      issues: write
    steps:
      # A scheduled run has no pull request to surface its result on, so the
      # failure is recorded as an issue. Reusing one issue per workflow keeps a
      # recurring failure in a single thread instead of opening one every week.
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          RUN_URL: ${{ inputs.run_url }}
        run: |
          TITLE="Scheduled run failed: ${WORKFLOW_NAME}"
          export TITLE

          number="$(gh issue list --repo "$REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq 'map(select(.title == env.TITLE)) | first | .number // empty')"

          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPOSITORY" \
              --body "The scheduled run failed again: ${RUN_URL}"
            echo "Commented on issue #${number}"
            exit 0
          fi

          body="$(printf '%s\n\n%s\n\n%s\n' \
            "The scheduled run of \`${WORKFLOW_NAME}\` failed." \
            "Run: ${RUN_URL}" \
            "This issue is reused for every later failure of the same workflow. Close it once the workflow is green again.")"

          gh issue create --repo "$REPOSITORY" --title "$TITLE" --body "$body"
