name: Reusable Link Check Workflow

# Required permissions for calling workflow:
# permissions:
#   contents: read       # For checking out code

on:
  workflow_call:
    inputs:
      lychee_version:
        description: "lychee release to run"
        required: false
        type: string
        default: "v0.24.2"
      paths:
        description: "Inputs to check (newline-separated)"
        required: false
        type: string
        default: "."
      config_file:
        description: "lychee config file path (empty: discover lychee.toml)"
        required: false
        type: string
        default: ""
      lychee_args:
        description: "Additional arguments for lychee"
        required: false
        type: string
        default: ""
      runs_on:
        description: "Runner to use for the job"
        required: false
        type: string
        default: "ubuntu-24.04"
      fetch_depth:
        description: "Number of commits to fetch (0 = all history)"
        required: false
        type: number
        default: 1
      timeout_minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 10

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lychee:
    name: Check Links
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      LYCHEE_BASE_URL: https://github.com/lycheeverse/lychee/releases/download/lychee-${{ inputs.lychee_version }}
      LYCHEE_BINDIR: ${{ github.workspace }}/.lychee-bin
    steps:
      # The github context of a called workflow is the caller's, so this takes
      # the calling repository and the paths below resolve against the
      # documents that repository carries
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          persist-credentials: false

      # The release publishes one archive per target triple, so the runner
      # architecture decides which name to fetch
      - name: Resolve the lychee release asset
        run: |
          case "$(uname -m)" in
            x86_64) target="x86_64-unknown-linux-gnu" ;;
            aarch64 | arm64) target="aarch64-unknown-linux-gnu" ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2 && exit 1 ;;
          esac

          {
            echo "LYCHEE_ASSET=lychee-${target}.tar.gz"
            echo "LYCHEE_MEMBER=lychee-${target}/lychee"
          } >>"$GITHUB_ENV"

      # The checksum file sits beside the archive in the same release, so a
      # tampered download fails here rather than at the first link it reads
      - name: Download and verify lychee
        run: |
          mkdir -p "$LYCHEE_BINDIR"
          cd "$LYCHEE_BINDIR"
          curl -fsSL "${LYCHEE_BASE_URL}/${LYCHEE_ASSET}" -o "$LYCHEE_ASSET"
          curl -fsSL "${LYCHEE_BASE_URL}/${LYCHEE_ASSET}.sha256" -o "${LYCHEE_ASSET}.sha256"
          sha256sum --check "${LYCHEE_ASSET}.sha256"

      - name: Install lychee
        run: |
          tar -xzf "${LYCHEE_BINDIR}/${LYCHEE_ASSET}" -C "$LYCHEE_BINDIR" --strip-components=1 "$LYCHEE_MEMBER"
          echo "$LYCHEE_BINDIR" >>"$GITHUB_PATH"
          "${LYCHEE_BINDIR}/lychee" --version

      # An unreadable config is reported here rather than as a parse failure,
      # and an empty paths input would otherwise check nothing and pass
      - name: Validate the link check inputs
        env:
          PATHS: ${{ inputs.paths }}
          CONFIG_FILE: ${{ inputs.config_file }}
        run: |
          if [[ -z "${PATHS//[[:space:]]/}" ]]; then
            echo "paths listed no input" >&2
            exit 1
          fi

          if [[ -n "$CONFIG_FILE" && ! -f "$CONFIG_FILE" ]]; then
            echo "config_file not found: $CONFIG_FILE" >&2
            exit 1
          fi

      # GITHUB_TOKEN raises the github.com rate limit, which an anonymous run
      # reaches as 429 on a repository that links to GitHub often
      - name: Check links
        env:
          PATHS: ${{ inputs.paths }}
          CONFIG_FILE: ${{ inputs.config_file }}
          LYCHEE_ARGS: ${{ inputs.lychee_args }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          readarray -t targets < <(grep -v '^[[:space:]]*$' <<<"$PATHS")
          read -r -a extra <<<"$LYCHEE_ARGS"

          config=()
          [[ -n "$CONFIG_FILE" ]] && config+=(--config "$CONFIG_FILE")

          lychee "${config[@]}" "${extra[@]}" "${targets[@]}"
