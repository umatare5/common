name: Reusable Tagging Workflow

# Required permissions for calling workflow:
# permissions:
#   contents: write       # For creating and pushing tags

on:
  workflow_call:
    inputs:
      version_file:
        description: "Version file path"
        required: false
        type: string
        default: "VERSION"
      tag_prefix:
        description: "Tag prefix (e.g., 'v' for v1.0.0)"
        required: false
        type: string
        default: "v"
      runs_on:
        description: "Runner to use for the job"
        required: false
        type: string
        default: "ubuntu-24.04"
      git_user_name:
        description: "Git user name for commits"
        required: false
        type: string
        default: "github-actions[bot]"
      git_user_email:
        description: "Git user email for commits"
        required: false
        type: string
        default: "github-actions[bot]@users.noreply.github.com"

jobs:
  update-tag:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write

    steps:
      # The credentials stay in .git/config because the push below needs them;
      # every other workflow here sets persist-credentials: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read version information from specified file for tag creation
      - name: Read VERSION file
        env:
          VERSION_FILE: ${{ inputs.version_file }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          [ -f "$VERSION_FILE" ] || { echo "Error: version file not found: $VERSION_FILE" >&2; exit 1; }

          version="$(tr -d '[:space:]' <"$VERSION_FILE")"
          echo "TAG_NAME=${TAG_PREFIX}${version}" >>"$GITHUB_ENV"
          echo "VERSION=${version}" >>"$GITHUB_ENV"

      # The checkout is shallow and fetches no tags, so a local rev-parse would
      # never match; the remote is the only place the tag can already exist
      - name: Skip when the tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >>"$GITHUB_ENV"
            echo "Tag ${TAG_NAME} already exists on origin"
          fi

      - name: Create and push tag
        if: env.TAG_EXISTS != 'true'
        env:
          GIT_USER_NAME: ${{ inputs.git_user_name }}
          GIT_USER_EMAIL: ${{ inputs.git_user_email }}
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

          git tag -a "$TAG_NAME" -m "Release version ${VERSION}"
          git push origin "$TAG_NAME"

      # A release workflow triggered by this push reads the tag from origin, so
      # the run waits for it rather than racing the propagation
      - name: Wait the tag creation
        if: env.TAG_EXISTS != 'true'
        run: |
          for attempt in $(seq 1 60); do
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
              echo "Verified remote tag: ${TAG_NAME}"
              exit 0
            fi

            echo "[${attempt}/60] Tag is not visible on origin yet; retrying in 1s"
            sleep 1
          done

          echo "Error: timed out waiting for remote tag: ${TAG_NAME}" >&2
          exit 1
