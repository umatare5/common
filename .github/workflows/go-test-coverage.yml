name: Reusable Go Coverage Test Workflow

# Required permissions for calling workflow:
# permissions:
#   contents: read        # For checking out code
#   pull-requests: write  # For writing PR comments (if needed)

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go version to use"
        required: false
        type: string
        default: "1.24.5"
      coverage_threshold:
        description: "Minimum coverage percentage required"
        required: false
        type: number
        default: 80
      coverage_file:
        description: "Coverage output file path"
        required: false
        type: string
        default: "./coverage.out"
      runs_on:
        description: "Runner to use for the job"
        required: false
        type: string
        default: "ubuntu-24.04"
      fetch_depth:
        description: "Number of commits to fetch (0 = all history)"
        required: false
        type: number
        default: 1
      test_packages:
        description: "Test packages pattern"
        required: false
        type: string
        default: "./..."
      gotestsum_format:
        description: "gotestsum output format"
        required: false
        type: string
        default: "testname"
      enable_race_detection:
        description: "Enable race detection in tests"
        required: false
        type: boolean
        default: true
      coverage_exclude_pattern:
        description: "Regular expression pattern to exclude files/directories from coverage"
        required: false
        type: string
        default: ""

jobs:
  coverage:
    name: Coverage Test
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read

    steps:
      # Checkout the code repository to access source files for coverage analysis
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          persist-credentials: false

      # Set up Go development environment with dependency caching for faster builds
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      # Clean and verify Go module dependencies to ensure consistent test environment
      - name: Verify dependencies
        run: |
          go mod tidy
          go mod verify

      # Install gotestsum for enhanced test output and coverage reporting
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      # Execute tests with coverage profiling and optional race detection
      - name: Run tests with coverage
        env:
          RACE: ${{ inputs.enable_race_detection }}
          FORMAT: ${{ inputs.gotestsum_format }}
          COVERAGE_FILE: ${{ inputs.coverage_file }}
          TEST_PACKAGES: ${{ inputs.test_packages }}
        run: |
          args=(--format "$FORMAT" -- "-coverprofile=$COVERAGE_FILE")
          if [ "$RACE" = "true" ]; then
            args+=(-race)
          fi

          # The package input is a word list rather than one path, so it is
          # split before use instead of being passed as a single argument
          read -r -a packages <<<"$TEST_PACKAGES"
          gotestsum "${args[@]}" "${packages[@]}"

      # Filter coverage data to exclude specified patterns
      - name: Filter coverage data
        if: inputs.coverage_exclude_pattern != ''
        env:
          COVERAGE_FILE: ${{ inputs.coverage_file }}
          EXCLUDE_PATTERN: ${{ inputs.coverage_exclude_pattern }}
        run: |
          filtered="$(mktemp)"

          # The header names the mode and has to survive the filter
          head -1 "$COVERAGE_FILE" >"$filtered"
          tail -n +2 "$COVERAGE_FILE" | grep -vE "$EXCLUDE_PATTERN" >>"$filtered"
          mv "$filtered" "$COVERAGE_FILE"

      # Parse coverage report and extract overall coverage percentage for validation
      - name: Extract coverage percentage
        id: coverage
        env:
          COVERAGE_FILE: ${{ inputs.coverage_file }}
        run: |
          coverage="$(go tool cover -func="$COVERAGE_FILE" | tail -1 | awk '{print $3}' | tr -d '%')"
          echo "percentage=${coverage}" >>"$GITHUB_OUTPUT"
          echo "Coverage: ${coverage}%"

      # Fail the workflow if coverage falls below the specified threshold
      - name: Check coverage threshold
        if: steps.coverage.outputs.percentage < inputs.coverage_threshold
        env:
          COVERAGE_FILE: ${{ inputs.coverage_file }}
          PERCENTAGE: ${{ steps.coverage.outputs.percentage }}
          THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          echo "Coverage ${PERCENTAGE}% is below the ${THRESHOLD}% threshold"
          go tool cover -func="$COVERAGE_FILE" | grep -v "100.0%"
          exit 1

      # Display success message when coverage meets or exceeds the threshold
      - name: Coverage success
        if: steps.coverage.outputs.percentage >= inputs.coverage_threshold
        run: echo "✅ Coverage ${{ steps.coverage.outputs.percentage }}% >= ${{ inputs.coverage_threshold }}%"
