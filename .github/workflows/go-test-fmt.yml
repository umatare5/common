name: Reusable Go Format and Lint Workflow

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go version to use"
        required: false
        type: string
        default: "1.24.5"
      golangci_lint_version:
        description: "golangci-lint version to use"
        required: false
        type: string
        default: "v1.64.8"
      golangci_lint_config:
        description: "golangci-lint config file path"
        required: false
        type: string
        default: ".golangci.yml"
      runs_on:
        description: "Runner to use for the job"
        required: false
        type: string
        default: "ubuntu-24.04"
      fetch_depth:
        description: "Number of commits to fetch (0 = all history)"
        required: false
        type: number
        default: 1
      timeout:
        description: "Timeout for golangci-lint execution"
        required: false
        type: string
        default: "5m"
      golangci_lint_args:
        description: "Additional arguments for golangci-lint"
        required: false
        type: string
        default: "--verbose --print-resources-usage"
      enable_cache:
        description: "Enable golangci-lint cache"
        required: false
        type: boolean
        default: true
      cache_key_suffix:
        description: "Additional suffix for cache key"
        required: false
        type: string
        default: ""

jobs:
  fmt:
    name: Run Go Format and Lint
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read

    steps:
      # Checkout the code repository to access source files
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          persist-credentials: false

      # Set up Go development environment with specified version
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}

      # Cache golangci-lint binary and dependencies for faster subsequent runs
      - name: Cache golangci-lint
        if: ${{ inputs.enable_cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles(inputs.golangci_lint_config) }}${{ inputs.cache_key_suffix }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-

      # The installer is fetched at the pinned tag rather than from the site,
      # so the script that runs here is the one that version publishes
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: ${{ inputs.golangci_lint_version }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"

      # Clean Go module cache and verify dependencies for consistent builds
      - name: Clean Go cache and modules
        run: |
          go mod tidy
          go mod verify

      # Execute golangci-lint with configuration file and custom arguments
      - name: Run golangci-lint
        env:
          CONFIG: ${{ inputs.golangci_lint_config }}
          TIMEOUT: ${{ inputs.timeout }}
          EXTRA_ARGS: ${{ inputs.golangci_lint_args }}
        run: |
          # A missing config means the caller would be linted against defaults it
          # never chose, so the run stops before spending the time
          if [ ! -f "$CONFIG" ]; then
            echo "Error: golangci-lint config not found: $CONFIG" >&2
            exit 1
          fi

          read -r -a extra <<<"$EXTRA_ARGS"
          golangci-lint run --config "$CONFIG" --timeout "$TIMEOUT" "${extra[@]}"
